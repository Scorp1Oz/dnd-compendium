<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="opBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241a1a" />
      <stop offset="60%" stop-color="#140f11" />
      <stop offset="100%" stop-color="#080607" />
    </radialGradient>
    <linearGradient id="opSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="opEyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="96" fill="url(#opBg)" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3" opacity="0.8" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#78350f" stroke-width="1" opacity="0.4" />

  <!-- Crossed Swords in Background -->
  <line x1="45" y1="45" x2="155" y2="155" stroke="url(#opSteel)" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <line x1="155" y1="45" x2="45" y2="155" stroke="url(#opSteel)" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <circle cx="100" cy="100" r="14" fill="#080607" stroke="#ef4444" stroke-width="2" />

  <!-- Hooded Master Silhouette -->
  <!-- Hood Outline -->
  <path d="M68,155 C65,110 75,70 100,52 C125,70 135,110 132,155 C120,165 80,165 68,155 Z" fill="#181316" stroke="#475569" stroke-width="1.5" />
  <!-- Inner Hood Void -->
  <path d="M78,145 C78,115 85,85 100,72 C115,85 122,115 122,145 C112,152 88,152 78,145 Z" fill="#0a0709" />

  <!-- Mysterious Glowing Eyes -->
  <ellipse cx="91" cy="108" rx="4" ry="2" fill="#ef4444" filter="url(#opEyeGlow)" />
  <ellipse cx="109" cy="108" rx="4" ry="2" fill="#ef4444" filter="url(#opEyeGlow)" />
  <circle cx="91" cy="108" r="1" fill="#fff" />
  <circle cx="109" cy="108" r="1" fill="#fff" />
</svg>
