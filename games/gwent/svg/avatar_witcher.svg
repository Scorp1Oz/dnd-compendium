<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="witcherBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2838" />
      <stop offset="60%" stop-color="#0e131d" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="96" fill="url(#witcherBg)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.9" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#64748b" stroke-width="1" opacity="0.4" />

  <!-- Wolf Head Silhouette & Facets -->
  <!-- Ears -->
  <polygon points="100,52 74,26 80,68" fill="url(#silverPlate)" stroke="#475569" stroke-width="1.2" />
  <polygon points="100,52 126,26 120,68" fill="url(#silverPlate)" stroke="#475569" stroke-width="1.2" />

  <!-- Brow & Temples -->
  <polygon points="100,52 80,68 60,90 85,98 100,78" fill="url(#silverPlate)" stroke="#334155" stroke-width="1.2" />
  <polygon points="100,52 120,68 140,90 115,98 100,78" fill="url(#silverPlate)" stroke="#334155" stroke-width="1.2" />

  <!-- Center Forehead -->
  <polygon points="100,78 85,98 100,122 115,98" fill="#cbd5e1" stroke="#f59e0b" stroke-width="1" />

  <!-- Snout -->
  <polygon points="100,122 88,148 100,172 112,148" fill="url(#silverPlate)" stroke="#475569" stroke-width="1.2" />

  <!-- Eyes (Glowing Amber) -->
  <polygon points="84,92 95,96 90,102" fill="#f59e0b" filter="url(#eyeGlow)" />
  <polygon points="116,92 105,96 110,102" fill="#f59e0b" filter="url(#eyeGlow)" />
  <circle cx="90" cy="96" r="1.5" fill="#fff" />
  <circle cx="110" cy="96" r="1.5" fill="#fff" />

  <!-- Cheeks & Jaws -->
  <polygon points="88,148 70,160 82,168 90,156" fill="#64748b" stroke="#334155" stroke-width="1" />
  <polygon points="112,148 130,160 118,168 110,156" fill="#64748b" stroke="#334155" stroke-width="1" />
  <polygon points="90,156 94,180 100,162" fill="#f1f5f9" />
  <polygon points="110,156 106,180 100,162" fill="#f1f5f9" />
</svg>
