<style>
  :root{
    --ink:#e9e2d0;
    --ink-dim:#a89d86;
    --steel-0:#0e1013;
    --steel-1:#181b20;
    --steel-2:#22262d;
    --line:#3a3f46;
    --crimson:#8c2f39;
    --crimson-bright:#b8404c;
    --brass:#c9a227;
    --brass-dim:#8a7223;
    --die:#5b7185;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    min-height:100dvh;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 26px),
      radial-gradient(ellipse at 20% -10%, #23262c 0%, var(--steel-0) 55%);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    font-size:19px;
    display:flex;
    justify-content:center;
    padding:48px 20px 90px;
    padding-top:calc(48px + env(safe-area-inset-top));
    padding-left:calc(20px + env(safe-area-inset-left));
    padding-right:calc(20px + env(safe-area-inset-right));
    padding-bottom:calc(90px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  .app{width:100%;max-width:920px;}
  .app.wide{max-width:1400px;}
  .app.home-wide{max-width:1060px;}

  /* ---------- header / breadcrumb ---------- */
  .crumb{
    display:flex;align-items:center;gap:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:26px;
    min-height:20px;
  }
  .crumb .seg{cursor:pointer;transition:color .15s;}
  .crumb .seg:hover{color:var(--brass);}
  .crumb .seg.current{color:var(--ink);cursor:default;}
  .crumb .sep{color:var(--line);}

  .back{
    background:none;border:1px solid var(--line);color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;
    padding:7px 14px;border-radius:2px;cursor:pointer;
    transition:all .15s;margin-bottom:22px;
  }
  .back:hover{border-color:var(--brass-dim);color:var(--brass);}

  h1{
    font-family:'Cinzel',serif;font-weight:700;
    font-size:clamp(28px,4vw,42px);
    letter-spacing:.03em;
    margin:0 0 6px;
    color:var(--ink);
  }
  .subtitle{
    color:var(--ink-dim);font-style:italic;font-size:17px;margin:0 0 34px;
    max-width:60ch;
  }
  .rule{
    height:1px;
    background:linear-gradient(90deg, var(--brass-dim), transparent 70%);
    margin:0 0 34px;
  }

  /* ---------- menu list (screens 1 & 2) ---------- */
  .menu-list{display:flex;flex-direction:column;gap:12px;}
  .menu-list.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .menu-list.grid-2 .menu-item{margin-bottom:0;}
  .menu-item{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--steel-1);
    border:1px solid var(--line);
    border-left:3px solid var(--brass-dim);
    padding:20px 24px;
    cursor:pointer;
    transition:background .15s, border-color .15s, transform .1s;
    position:relative;
  }
  .menu-item:hover:not(.disabled){
    background:var(--steel-2);
    border-left-color:var(--crimson-bright);
  }
  .menu-item:active:not(.disabled){transform:translateX(2px);}
  .menu-item .name{
    font-family:'Cinzel',serif;font-size:20px;letter-spacing:.02em;
  }
  .menu-item .desc{
    font-size:15px;color:var(--ink-dim);font-style:italic;margin-top:4px;
  }
  .menu-item .arrow{
    font-family:'JetBrains Mono',monospace;color:var(--brass);font-size:18px;
  }
  .menu-item.disabled{
    opacity:.4;cursor:not-allowed;border-left-color:var(--line);
  }
  .menu-item.disabled .arrow{color:var(--ink-dim);}
  .tag-soon{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-dim);
    border:1px solid var(--line);padding:2px 7px;border-radius:2px;
  }
  .section-label{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--ink-dim);
    margin:28px 0 12px;
  }
  .menu-item.util{border-left-color:var(--die);}
  .menu-item.util:hover{border-left-color:var(--die);background:var(--steel-2);}

  .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
  .pill{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.04em;
    background:var(--steel-1);color:var(--ink-dim);
    border:1px solid var(--line);border-radius:2px;
    padding:8px 14px;cursor:pointer;transition:all .15s;
  }
  .pill:hover{border-color:var(--brass-dim);color:var(--ink);}
  .pill.active{
    background:var(--crimson);border-color:var(--crimson-bright);color:var(--ink);
  }
  .card.term .name{margin-bottom:6px;}

  .stance-block{margin-bottom:22px;}
  .stance-block .card{border-left:3px solid var(--brass-dim);}
  .stance-attacks-label{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;
    color:var(--brass);
    margin:10px 0 8px 6px;
  }
  .attacks-grid{
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    padding-left:18px;
    border-left:2px solid var(--line);
    margin-left:6px;
  }

  /* ---------- maneuver grid (screen 3) ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
    gap:14px;
  }
  .card{
    background:var(--steel-1);
    border:1px solid var(--line);
    padding:18px 18px 16px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:border-color .15s, background .15s, transform .08s;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--crimson);opacity:.55;
    transition:opacity .15s;
  }
  .card:hover{background:var(--steel-2);border-color:var(--brass-dim);}
  .card:hover::before{opacity:1;}
  .card:active{transform:scale(.98);}
  .card .top-row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    margin-bottom:10px;
  }
  .card .name{
    font-family:'Cinzel',serif;font-size:17px;line-height:1.3;
    letter-spacing:.01em;
  }
  .card .die-badge{
    flex-shrink:0;
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    color:var(--die);
    border:1px solid var(--die);
    border-radius:2px;
    padding:2px 6px;
    letter-spacing:.05em;
  }
  .card .eng{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;
    margin-bottom:10px;
  }
  .card .desc{
    font-size:14.5px;line-height:1.45;color:var(--ink-dim);
  }
  .card .tmpl{
    font-family:'JetBrains Mono',monospace;font-size:13px;
    color:var(--brass);
    background:var(--steel-0);
    border:1px solid var(--line);
    padding:8px 10px;
    margin-bottom:10px;
    word-break:break-word;
  }
  .card.featured{
    border-color:var(--brass-dim);
    background:var(--steel-2);
  }
  .card.featured::before{background:var(--brass);opacity:.8;}
  .card.featured .name{font-size:20px;}
  .card.featured .tmpl{font-size:16px;padding:12px 14px;color:var(--brass);}

  .gen-btn{
    display:block;width:100%;margin-top:10px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.03em;
    background:var(--steel-2);border:1px solid var(--line);color:var(--brass);
    padding:8px 8px;border-radius:2px;cursor:pointer;transition:all .15s;
    text-align:center;line-height:1.3;
  }
  .gen-btn:hover{border-color:var(--brass-dim);background:var(--steel-0);}
  .gen-stamp{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(14,16,19,.92);
    opacity:0;pointer-events:none;
    transition:opacity .15s;
  }
  .gen-stamp.active{opacity:1;}
  .gen-die{position:relative;width:64px;height:64px;}
  .gen-die svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));}
  .gen-die .val{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:22px;color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,.55);
  }
  .gen-die.rolling{animation:diceshake .14s linear infinite;}

  /* stamp feedback */
  .stamp{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(14,16,19,.88);
    opacity:0;pointer-events:none;
    transition:opacity .12s;
  }
  .card.stamped .stamp{opacity:1;transition:opacity .05s;}
  .stamp span{
    font-family:'Cinzel',serif;font-weight:700;font-size:15px;
    letter-spacing:.15em;text-transform:uppercase;
    color:var(--crimson-bright);
    border:2px solid var(--crimson-bright);
    padding:6px 14px;
    transform:rotate(-6deg) scale(1.15);
    animation:stampin .32s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes stampin{
    0%{transform:rotate(-6deg) scale(1.8);opacity:0;}
    60%{opacity:1;}
    100%{transform:rotate(-6deg) scale(1);opacity:1;}
  }

  /* ---------- dice roller ---------- */
  .dice-tray{
    min-height:230px;
    background:var(--steel-0);
    border:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:18px;
    align-items:center;justify-content:center;
    padding:28px 20px;
  }
  .dice-tray .empty-hint{
    color:var(--ink-dim);font-style:italic;font-size:15.5px;text-align:center;line-height:1.6;
  }
  .die{width:88px;height:88px;position:relative;cursor:pointer;transition:transform .15s, filter .15s;}
  .die:hover{transform:scale(1.07);filter:brightness(1.12);}
  .die svg{width:100%;height:100%;display:block;filter:drop-shadow(0 5px 10px rgba(0,0,0,.45));}
  .die .val{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:27px;color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,.55);pointer-events:none;
  }
  .die.scoin .val{font-size:32px;font-weight:700;color:#fff8db;text-shadow:0 2px 8px rgba(0,0,0,.85);font-family:'Cinzel',serif;}
  .die.s2 .val{font-size:28px;font-weight:700;color:#ffffff;font-family:'JetBrains Mono',monospace;text-shadow:0 2px 6px rgba(0,0,0,.85);}
  .die.s3 .val, .die.s4 .val{padding-top:22px;font-size:22px;}
  .die.s10 .val{padding-bottom:12px;}
  .die.rolling{animation:diceshake .14s linear infinite;}
  @keyframes diceshake{
    0%{transform:rotate(-10deg) scale(1.06);}
    50%{transform:rotate(10deg) scale(.96);}
    100%{transform:rotate(-10deg) scale(1.06);}
  }
  .dice-total-row{
    display:flex;align-items:flex-end;justify-content:flex-end;gap:14px;
    margin:14px 0 2px;position:relative;
  }
  .dice-total-row .cap{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);}
  .dice-total-row .sum{font-family:'Cinzel',serif;font-weight:700;font-size:44px;color:var(--ink);line-height:1;}

  .dice-history{
    flex:1;min-width:0;height:46px;
    display:flex;align-items:center;justify-content:flex-end;gap:9px;
    overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, rgba(0,0,0,.35) 40px, #000 110px, #000 100%);
    mask-image:linear-gradient(90deg, transparent 0, rgba(0,0,0,.35) 40px, #000 110px, #000 100%);
  }
  .hist-die{
    width:34px;height:34px;position:relative;flex-shrink:0;
  }
  .hist-die svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));}
  .hist-die .hv{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .hist-die .he{
    position:absolute;top:-5px;right:-6px;font-size:12px;line-height:1;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));
  }
  .hist-die.hist-new{animation:histIn .38s cubic-bezier(.2,.9,.3,1);}
  @keyframes histIn{
    0%{transform:translateX(26px) scale(.7);opacity:0;}
    100%{transform:translateX(0) scale(1);opacity:1;}
  }
  .hist-tip{

  .hero-dice{

  .dice-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  .field label{

    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;

  }

  }

  .stock-qty-ctrl{display:flex;align-items:center;gap:8px;}

  .stock-remove{background:none;border:none;color:var(--ink-dim);cursor:pointer;font-size:15px;padding:4px;}

  .add-ingredient-row{

  }
  .add-ingredient-row input[type=text]{flex:2;min-width:160px;}
  .add-ingredient-row input[type=number]{width:80px;}

  @media (prefers-reduced-motion: reduce){
    .stamp span{animation:none;}
    .die.rolling{animation:none;}
    .gen-die.rolling{animation:none;}
    .hist-die.hist-new{animation:none;}

  /* ---------- mobile ---------- */
  @media (max-width: 640px){

/* Фоновые левитирующие частицы-плюсики Тьмы Клана Кураями */
.sh-kurayami-particles {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
  display: none;
}
body.sh-theme-kurayami .sh-kurayami-particles {
  display: block;
}
.sh-kurayami-plus-particle {
  position: absolute;
  pointer-events: none;
  will-change: transform, opacity;
  opacity: 0;
}
.sh-kurayami-plus-particle::before,
.sh-kurayami-plus-particle::after {
  content: '';
  position: absolute;
  background: var(--p-col, #a6a6a6);
  border-radius: 1px;
  box-shadow: 0 0 3px rgba(255, 255, 255, 0.25), 0 0 6px rgba(0, 0, 0, 0.9);
}
.sh-kurayami-plus-particle::before {
  top: 50%;
  left: 0;
  width: 100%;
  height: var(--p-th, 1.5px);
  transform: translateY(-50%);
}
.sh-kurayami-plus-particle::after {
  left: 50%;
  top: 0;
  height: 100%;
  width: var(--p-th, 1.5px);
  transform: translateX(-50%);
}

/* Дрейф и мерцание плюсиков Кураями в разные стороны */
@keyframes kurayamiDrift1 {
  0% { transform: translate(0, 0) rotate(0deg) scale(0.8); opacity: 0; }
  25% { opacity: var(--p-op, 0.18); transform: translate(18px, -24px) rotate(15deg) scale(1); }
  60% { opacity: var(--p-op, 0.22); transform: translate(32px, -48px) rotate(35deg) scale(1.05); }
  85% { opacity: var(--p-op, 0.12); }
  100% { transform: translate(45px, -70px) rotate(55deg) scale(0.7); opacity: 0; }
}

@keyframes kurayamiDrift2 {
  0% { transform: translate(0, 0) rotate(0deg) scale(0.7); opacity: 0; }
  20% { opacity: var(--p-op, 0.16); transform: translate(-20px, 16px) rotate(-18deg) scale(1); }
  55% { opacity: var(--p-op, 0.20); transform: translate(-38px, 32px) rotate(-38deg) scale(1); }
  80% { opacity: var(--p-op, 0.10); }
  100% { transform: translate(-54px, 48px) rotate(-60deg) scale(0.75); opacity: 0; }
}

@keyframes kurayamiDrift3 {
  0% { transform: translate(0, 0) rotate(12deg) scale(0.9); opacity: 0; }
  25% { opacity: var(--p-op, 0.19); transform: translate(-16px, -28px) rotate(-10deg) scale(1); }
  65% { opacity: var(--p-op, 0.23); transform: translate(-32px, -52px) rotate(-30deg) scale(1.1); }
  85% { opacity: var(--p-op, 0.11); }
  100% { transform: translate(-44px, -74px) rotate(-50deg) scale(0.8); opacity: 0; }
}

@keyframes kurayamiDrift4 {
  0% { transform: translate(0, 0) rotate(-10deg) scale(0.8); opacity: 0; }
  22% { opacity: var(--p-op, 0.17); transform: translate(22px, 20px) rotate(15deg) scale(1); }
  58% { opacity: var(--p-op, 0.21); transform: translate(40px, 38px) rotate(35deg) scale(1); }
  82% { opacity: var(--p-op, 0.10); }
  100% { transform: translate(58px, 56px) rotate(60deg) scale(0.7); opacity: 0; }
}

@keyframes kurayamiDrift5 {
  0% { transform: translate(0, 0) rotate(0deg) scale(0.7); opacity: 0; }
  30% { opacity: var(--p-op, 0.24); transform: translate(14px, -18px) rotate(45deg) scale(1.1); }
  60% { opacity: var(--p-op, 0.18); transform: translate(-12px, -32px) rotate(90deg) scale(1); }
  85% { opacity: var(--p-op, 0.12); }
  100% { transform: translate(4px, -46px) rotate(135deg) scale(0.8); opacity: 0; }
}

/* Фоновые левитирующие веера символики Клана Учиха (эффект пыли / частиц) */
.sh-uchiha-particles {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;

.sh-debt-zone-head{
  display:flex;
  align-items:flex-start;
  gap:10px;
}
.sh-debt-zone-title{
  font-family:'Cinzel',serif;
  font-size:14.5px;
  font-weight:700;
  color:#ff7675;
}
.sh-debt-zone-sub{
  font-size:12px;
  color:var(--ink-dim);
  margin-top:2px;
}
/* Предел тела / перегрузка */
.sh-meter-calc-card{
  background:linear-gradient(145deg, rgba(28,24,18,0.8) 0%, rgba(18,15,11,0.9) 100%);
  border:1px solid var(--brass);
  border-radius:6px;
  padding:14px;
}
.sh-meter-calc-top{
  display:flex;
  align-items:flex-start;
  gap:12px;
}
.sh-meter-calc-icon{
  font-size:24px;
}
.sh-meter-calc-title{
  font-family:'Cinzel',serif;
  font-size:14.5px;
  font-weight:700;
  color:#f6e58d;
}
.sh-meter-calc-desc{
  font-size:12.5px;
  line-height:1.48;
  color:var(--ink-dim);
  margin-top:4px;
}
.sh-stages-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:10px;
  margin-top:10px;
}
.sh-stage-card{
  border:1px solid;
  border-radius:6px;
  background:rgba(20,15,12,0.8);
  padding:12px;
}
.sh-stage-head{
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:13.5px;
  margin-bottom:6px;
}
.sh-stage-dmg{
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  font-weight:700;
  color:#fff;
  margin-bottom:4px;
}
.sh-stage-debuff{
  font-size:11.5px;
  line-height:1.4;
  color:var(--ink-dim);
}
/* Формула познания */
.sh-formula-banner{
  background:linear-gradient(145deg, rgba(26,22,17,0.9) 0%, rgba(16,14,10,0.95) 100%);
  border:1px solid var(--brass);
  border-radius:6px;
  padding:16px;
  text-align:center;
}
.sh-formula-equation{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font-family:'Cinzel',serif;
  font-size:17px;
  font-weight:700;
  color:var(--ink);
  flex-wrap:wrap;
}
.sh-form-part{
  background:rgba(255,255,255,0.05);
  border:1px solid var(--line);
  padding:6px 14px;
  border-radius:4px;
}
.sh-form-plus, .sh-form-eq{
  color:var(--brass);
  font-size:20px;
}
.sh-form-res{
  background:rgba(201,164,92,0.18);
  border:1px solid var(--brass);
  color:#f6e58d;
  padding:6px 14px;
  border-radius:4px;
}
.sh-formula-sub{
  font-size:12.5px;
  color:var(--ink-dim);
  margin-top:10px;
  font-style:italic;
}
.sh-paths-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:12px;
}
.sh-path-card{
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  border-radius:6px;
  padding:12px 14px;
}
.sh-path-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}
.sh-path-icon{
  font-size:20px;
}
.sh-path-title{
  font-family:'Cinzel',serif;
  font-size:14px;
  font-weight:700;
  color:var(--ink);
}
.sh-path-tag{
  font-size:11px;
  color:var(--brass);
}
.sh-path-meta-row{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--ink-dim);
  padding:4px 0 6px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  margin-bottom:8px;
}
.sh-path-desc{
  font-size:12.5px;
  line-height:1.48;
  color:var(--ink-dim);
}
/* Дисциплины и истоки */
.sh-disc-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:10px;
}
.sh-disc-card{
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  border-radius:6px;
  padding:12px;
  transition:border-color .15s, transform .15s;
}
.sh-disc-card:hover{
  border-color:var(--brass);
  transform:translateY(-1px);
}
.sh-disc-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}
.sh-disc-icon{
  font-size:18px;
}
.sh-disc-name{
  font-family:'Cinzel',serif;
  font-size:13.5px;
  font-weight:700;
  color:var(--ink);
}
.sh-disc-desc{
  font-size:12px;
  line-height:1.45;
  color:var(--ink-dim);
}
.sh-origin-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:12px;
}
.sh-origin-card{
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  border-left:3px solid var(--brass);
  border-radius:6px;
  padding:12px 14px;
}
.sh-origin-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}
.sh-origin-icon{
  font-size:20px;
}
.sh-origin-title{
  font-family:'Cinzel',serif;
  font-size:13.5px;
  font-weight:700;
  color:var(--ink);
}
.sh-origin-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  padding:1px 6px;
  border-radius:3px;
  background:rgba(201,164,92,0.15);
  color:#f6e58d;
}
.sh-origin-desc{
  font-size:12.5px;
  line-height:1.48;
  color:var(--ink-dim);
}
/* Клоны */
.sh-clone-class-card{
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  border-radius:6px;
  padding:16px;
}
.sh-clone-class-title{
  font-family:'Cinzel',serif;
  font-size:15px;
  font-weight:700;
  color:var(--ink);
  margin-bottom:4px;
}
.sh-clone-class-sub{
  font-size:12.5px;
  line-height:1.45;
  color:var(--ink-dim);
  margin-bottom:12px;
}
/* Доска миссий */
.sh-mission-board{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:12px;
}
.sh-mission-card{
  border:1px solid;
  border-radius:6px;
  padding:14px;
  transition:transform .15s;
}
.sh-mission-card:hover{
  transform:translateY(-1px);
}
.sh-mission-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}
.sh-mission-rank{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  border-radius:4px;
  font-family:'Cinzel',serif;
  font-size:20px;
  font-weight:900;
  color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.sh-mission-req{
  font-size:11px;
  color:var(--ink-dim);
}
.sh-mission-risk{
  font-size:12px;
  font-weight:700;
  margin-top:2px;
}
.sh-mission-desc{
  font-size:12.5px;
  line-height:1.48;
  color:var(--ink);
}
/* Служба */
.sh-service-ladder{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.sh-service-card{
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  border-radius:6px;
  padding:12px 16px;
}
.sh-service-top{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:6px;
}
.sh-service-icon{
  font-size:18px;
}
.sh-service-title{
  font-family:'Cinzel',serif;
  font-size:14px;
  font-weight:700;
  color:var(--ink);
  flex:1;
}
.sh-service-step{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--ink-dim);
}
.sh-service-desc{
  font-size:12.5px;
  line-height:1.48;
  color:var(--ink-dim);
}

.sh-filter-pill:hover{
  border-color:var(--brass);
  color:var(--ink);
  background:rgba(30,26,20,0.9);
}
.sh-filter-pill.active{
  border-color:var(--brass);
  color:var(--ink);
  background:rgba(200,165,92,0.18);
  box-shadow:0 0 10px rgba(200,165,92,0.25);
  font-weight:600;
}
.sh-filter-pill .sh-pill-count{
  font-size:11px;
  opacity:0.75;
  background:rgba(0,0,0,0.35);
  padding:1px 6px;
  border-radius:10px;
}

/* Тактический лаунчер применения техник */
.sh-launcher{
  background:linear-gradient(145deg, #181511 0%, #100e0b 100%);
  border:1px solid var(--line);
  border-left:3px solid var(--crimson-bright);
  border-radius:6px;
  padding:16px 20px;
  margin:10px 0 20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
  transition:padding .2s ease, margin .2s ease;
}
.sh-launcher.collapsed{
  padding:10px 16px;
  margin:8px 0 16px;
  background:linear-gradient(145deg, #161310 0%, #0e0c0a 100%);
}
.sh-launcher.collapsed .sh-launcher-body{
  display:none;
}
.sh-launcher-toggle-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  cursor:pointer;
  user-select:none;
  padding:2px 0;
}
.sh-launcher-toggle-head:hover .sh-launcher-title{
  color:var(--brass);
}
.sh-launcher:not(.collapsed) .sh-launcher-toggle-head{
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.sh-launcher-toggle-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-family:'JetBrains Mono',monospace;
  color:var(--ink-muted);
  background:rgba(255,255,255,0.04);
  border:1px solid var(--line);
  padding:4px 10px;
  border-radius:4px;
  transition:all .15s ease;
}
.sh-launcher-toggle-head:hover .sh-launcher-toggle-btn{
  color:var(--ink);
  border-color:var(--brass);
  background:rgba(201,168,76,0.1);
}
.sh-launcher-toggle-arrow{
  font-size:10px;
  color:var(--brass);
}
.sh-launcher-head{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.sh-launcher-title{
  font-family:'Cinzel',serif;
  font-size:17px;
  color:var(--ink);
  letter-spacing:.04em;
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
}
.sh-launcher-title .sh-badge-tag{
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:.08em;
  padding:2px 8px;
  background:rgba(200,67,55,0.15);
  border:1px solid var(--crimson-bright);
  color:#ff9085;
  border-radius:3px;
  text-transform:uppercase;
}
.sh-launcher-sel-wrap{
  flex:1;
  min-width:240px;
}
.sh-launcher-sel-label{
  font-size:11px;
  color:var(--ink-muted);
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-family:'Cinzel',serif;
}
.sh-launcher-sel{
  width:100%;
  background:#14120f;
  border:1px solid var(--line);
  color:var(--ink);
  padding:8px 12px;
  border-radius:4px;
  font-size:14px;
  outline:none;
  transition:border-color .15s;
}
.sh-launcher-sel:focus{
  border-color:var(--brass);
}

/* Мини-экран костей */
.sh-launcher-screen{
  background:radial-gradient(ellipse at center, rgba(35,30,22,0.85) 0%, rgba(12,10,8,0.95) 100%);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:6px;
  padding:14px 16px;
  margin-bottom:14px;
  min-height:96px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  box-shadow:inset 0 2px 10px rgba(0,0,0,0.6);
}
.sh-screen-dice-tray{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  align-items:center;
  justify-content:center;
  width:100%;
}
.sh-scr-col{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  cursor:pointer;
  padding:6px 10px;
  border-radius:6px;
  border:1px solid transparent;
  transition:all .18s ease;
  user-select:none;
}
.sh-scr-col:hover{
  background:rgba(255,255,255,0.04);
  border-color:rgba(255,255,255,0.12);
}
.sh-scr-col.selected{
  background:rgba(200,165,92,0.14);
  border-color:var(--brass);
  box-shadow:0 0 14px rgba(200,165,92,0.3);
}
.sh-scr-col.selected .sh-scr-label{
  color:var(--brass-bright);
  font-weight:700;
}
.sh-scr-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--ink-dim);
  transition:color .15s;
}
.sh-scr-die{
  width:56px;
  height:56px;
  position:relative;
  cursor:pointer;
}
.sh-scr-die svg{
  width:100%;
  height:100%;
  display:block;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6));
}
.sh-scr-die .val{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:19px;
  color:#fff;
  text-shadow:0 2px 4px rgba(0,0,0,0.7);
  pointer-events:none;
}
.sh-scr-die.s20 .val{ font-size:18px; }
.sh-scr-die.s10 .val{ padding-bottom:8px; font-size:18px; }
.sh-scr-die.s4 .val{ padding-top:14px; font-size:16px; }
.sh-scr-die.rolling{ animation:diceshake .14s linear infinite; }
.sh-scr-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--brass);
}
.sh-scr-dmg-group{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  background:rgba(255,255,255,0.02);
  padding:6px 10px;
  border-radius:6px;
  border:1px dashed rgba(255,255,255,0.1);
  cursor:pointer;
  transition:all .18s ease;
  user-select:none;
}
.sh-scr-dmg-group:hover{
  background:rgba(255,255,255,0.05);
  border-color:rgba(255,255,255,0.2);
}
.sh-scr-dmg-group.selected{
  background:rgba(200,165,92,0.14);
  border-color:var(--brass);
  border-style:solid;
  box-shadow:0 0 14px rgba(200,165,92,0.3);
}
.sh-scr-dmg-group.selected .sh-scr-label{
  color:var(--brass-bright);
  font-weight:700;
}
.sh-scr-dmg-dice{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  justify-content:center;
}
.sh-scr-no-dmg{
  font-size:13px;
  color:var(--ink-dim);
  font-style:italic;
  padding:10px 14px;
}

/* Панель настройки модификатора выбранного кубика */
.sh-mod-bar{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  background:rgba(0,0,0,0.32);
  padding:8px 14px;
  border-radius:4px;
  border:1px solid rgba(255,255,255,0.06);
}
.sh-mod-target-info{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--ink-dim);
}
.sh-mod-target-tag{
  color:var(--brass-bright);
  font-family:'Cinzel',serif;
  font-weight:700;
  font-size:14px;
}
.sh-mod-controls{
  display:flex;
  align-items:center;
  gap:5px;
}
.sh-mod-step{
  width:32px;
  height:30px;
  background:var(--steel-1);
  border:1px solid var(--line);
  color:var(--ink);
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  font-weight:600;
  border-radius:3px;
  cursor:pointer;
  transition:all .15s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.sh-mod-step:hover{
  border-color:var(--brass);
  color:var(--brass);
  background:rgba(200,165,92,0.12);
}
.sh-active-mod-input{
  width:58px;
  height:30px;
  background:#100e0b;
  border:1px solid var(--line);
  color:var(--ink);
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:14px;
  font-weight:600;
  border-radius:3px;
}
.sh-active-mod-input:focus{
  border-color:var(--brass);
  outline:none;
}
.sh-mod-reset{
  padding:0 8px;
  height:30px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink-dim);
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  border-radius:3px;
  cursor:pointer;
  transition:all .15s;
}
.sh-mod-reset:hover{
  color:var(--ink);
  border-color:var(--brass-dim);
}
.sh-exp-check{
  display:inline-flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  font-size:13px;
  color:var(--ink);
  user-select:none;
}
.sh-exp-check input{
  cursor:pointer;
  accent-color:var(--crimson-bright);
}

/* Кнопки действий лаунчера */
.sh-launcher-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}
.sh-btn-launch{
  background:linear-gradient(180deg, #99332c 0%, #681f19 100%);
  border:1px solid var(--crimson-bright);
  color:#fff;
  padding:8px 18px;
  font-size:14px;
  font-weight:600;
  border-radius:4px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(180,40,30,0.35);
  transition:all .15s ease;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.sh-btn-launch:hover{
  background:linear-gradient(180deg, #b83c34 0%, #7e261f 100%);
  box-shadow:0 4px 14px rgba(200,67,55,0.5);
  transform:translateY(-1px);
}
.sh-btn-copy-all{
  background:linear-gradient(180deg, #2a5235 0%, #1c3824 100%);
  border:1px solid #489b65;
  color:#e8f7ed;
  padding:8px 18px;
  font-size:14px;
  font-weight:600;
  border-radius:4px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(40,140,70,0.25);
  transition:all .15s ease;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.sh-btn-copy-all:hover{
  background:linear-gradient(180deg, #356743 0%, #24482e 100%);
  border-color:#5fc584;
  box-shadow:0 4px 14px rgba(70,180,100,0.4);
  transform:translateY(-1px);
}
.sh-micro-btn{
  background:rgba(20,18,14,0.85);
  border:1px solid var(--line);
  color:var(--ink-dim);
  padding:7px 12px;
  font-size:12.5px;
  border-radius:4px;
  cursor:pointer;
  transition:all .15s ease;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.sh-micro-btn:hover{
  border-color:var(--brass);
  color:var(--ink);
  background:rgba(35,30,22,0.9);
}


/* Блок результата лаунчера */
.sh-launcher-result{
  margin-top:12px;
  background:#0e0c0a;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:4px;
  padding:10px 14px;
  position:relative;
  display:none;
}
.sh-launcher-result.has-result{
  display:block;
}
.sh-launcher-result-text{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:#d4cfc7;
  white-space:pre-wrap;
  line-height:1.6;
}
.sh-copy-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11.5px;
  color:#7be0a6;
  font-family:'JetBrains Mono',monospace;
  margin-top:6px;
}

/* Пульт кнопок мастера */
.sh-cmd-inspector{
  background:linear-gradient(145deg, #191612 0%, #100e0b 100%);
  border:1px solid var(--line);
  border-left:3px solid var(--crimson-bright);
  border-radius:6px;

.hb-count{ font-size:13px; color:var(--ink-dim); min-width:22px; text-align:right; }

.hb-active-box select{ flex:1; min-width:180px; }
.hb-hint{ font-size:13px; color:var(--ink-dim); font-style:italic; }

.hb-desc{ margin:14px 0 18px; line-height:1.6; }
.hb-row{ display:flex; gap:12px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); }

.hb-abil{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.hb-abil-box{ border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; background:var(--steel-1); }
.hb-abil-box label{ display:block; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.hb-abil-box input{ width:100%; text-align:center; font-size:18px; }
.hb-abil-val{ font-size:18px; }
.hb-abil-mod{ font-size:13px; color:var(--brass); margin-top:2px; }

.hb-custom-row{ display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; }
.hb-custom-row .hb-cust-k{ flex:0 0 34%; }
.hb-custom-row .hb-cust-v{ flex:1; }
.hb-x{ background:transparent; border:1px solid var(--line); color:var(--ink-dim);
  border-radius:8px; cursor:pointer; padding:6px 10px; font-family:inherit; }
.hb-x:hover{ color:#e26d6d; border-color:#e26d6d; }

.hb-rel{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; background:var(--steel-1); }
.hb-rel-head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.hb-rel-head .name{ flex:1; font-size:16px; }
.hb-stage{ font-size:12px; color:var(--brass); text-transform:uppercase; letter-spacing:.06em; }
.btn-ghost.sm{ font-size:12px; padding:5px 12px; margin-top:8px; }

@media (max-width:640px){
  .hb-abil{ grid-template-columns:repeat(2,1fr); }
  .hb-row{ flex-direction:column; gap:2px; }
  .hb-row-k{ min-width:0; }
  .hb-custom-row{ flex-wrap:wrap; }
}
/* ---------- Shinobi Interactive Map ---------- */
.sh-map-container{
  position:relative;
  background:#12100d;
  border:2px solid var(--brass, #c5a059);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,0.95), 0 8px 32px rgba(0,0,0,0.8), 0 0 20px rgba(197,160,89,0.3);
  margin-bottom:20px;
}
.sh-map-toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 16px;
  background:linear-gradient(180deg, rgba(30,24,18,0.98) 0%, rgba(20,16,12,0.98) 100%);
  border-bottom:2px solid rgba(197,160,89,0.5);
}
.sh-map-search-wrap{
  flex:1 1 200px;
  position:relative;
}
.sh-map-search-input{
  width:100%;
  box-sizing:border-box;
  padding:6px 12px 6px 30px;
  background:rgba(15,12,9,0.8);
  border:1px solid rgba(197,160,89,0.3);
  border-radius:8px;
  color:var(--ink,#e0d8cb);
  font-size:13px;
  outline:none;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.sh-map-search-input:focus{
  border-color:var(--brass,#c5a059);
  box-shadow:0 0 10px rgba(197,160,89,0.3);
}
.sh-map-search-icon{
  position:absolute;
  left:9px;
  top:50%;
  transform:translateY(-50%);
  font-size:12px;
  opacity:0.6;
  pointer-events:none;
}
.sh-map-controls{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.sh-map-btn{
  background:rgba(45,36,26,0.85);
  border:1px solid rgba(197,160,89,0.3);
  color:var(--ink,#e0d8cb);
  border-radius:6px;
  padding:5px 10px;
  font-size:12px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:all 0.2s;
}
.sh-map-btn:hover{
  background:rgba(70,56,40,0.9);
  border-color:var(--brass,#c5a059);
  color:#ffffff;
}
.sh-map-btn.active{
  background:var(--brass,#c5a059);
  color:#120f0b;
  font-weight:600;
}
.sh-map-chk{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  color:var(--ink-dim,#a89f91);
  cursor:pointer;
  user-select:none;
}
.sh-map-chk input{
  cursor:pointer;
  accent-color:var(--brass,#c5a059);
}
.sh-map-viewport{
  position:relative;
  height:520px;
  margin:10px 14px 14px 14px;
  border:2px solid var(--brass, #c5a059);
  border-radius:8px;
  overflow:hidden;
  background:#141c17;
  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
  touch-action:none;
  cursor:grab;
  box-shadow:0 0 16px rgba(197,160,89,0.35), inset 0 0 30px rgba(0,0,0,0.95);
}
.sh-map-corner{
  position:absolute;
  width:18px;
  height:18px;
  pointer-events:none;
  z-index:10;
  border-color:var(--brass,#c5a059);
  border-style:solid;
  opacity:0.85;
}
.sh-map-corner-tl{
  top:12px;
  left:12px;
  border-width:2px 0 0 2px;
}
.sh-map-corner-tr{
  top:12px;
  right:12px;
  border-width:2px 2px 0 0;
}
.sh-map-corner-bl{
  bottom:12px;
  left:12px;
  border-width:0 0 2px 2px;
}
.sh-map-corner-br{
  bottom:12px;
  right:12px;
  border-width:0 2px 2px 0;
}
.sh-map-viewport.grabbing{
  cursor:grabbing;
}
.sh-map-svg-wrap{
  width:100%;
  height:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
#shMapSvg{
  width:100%;
  height:100%;
  display:block;
  user-select:none;
  -webkit-user-select:none;
}
.sh-neutral-poly{
  pointer-events:none;
  vector-effect:non-scaling-stroke;
}
.sh-country-poly{
  cursor:pointer;
  transition:fill 0.25s, stroke 0.25s, fill-opacity 0.25s;
  vector-effect:non-scaling-stroke;
}
.sh-country-poly:hover,
.sh-country-poly.hover{
  fill-opacity:0.92 !important;
  stroke:#ffffff !important;
  stroke-width:3.5 !important;
  filter:drop-shadow(0 0 8px rgba(255,255,255,0.45));
}
.sh-country-poly.selected{
  fill-opacity:0.95 !important;
  stroke:#f6e58d !important;
  stroke-width:4 !important;
  filter:drop-shadow(0 0 14px rgba(246,229,141,0.75));
}
.sh-country-poly.selected:hover,
.sh-country-poly.selected.hover{
  fill-opacity:0.96 !important;
  stroke:#fff185 !important;
  stroke-width:4.2 !important;
  filter:drop-shadow(0 0 16px rgba(246,229,141,0.9));
}
.sh-country-poly.dimmed{
  fill-opacity:0.12 !important;
  opacity:0.25 !important;
}
.sh-village-marker{
  cursor:pointer;
}
.sh-village-marker .sh-village-dot{
  transition:r 0.2s cubic-bezier(0.175,0.885,0.32,1.275), stroke-width 0.2s ease;
}
.sh-village-marker .sh-village-pulse{
  transition:r 0.2s ease, fill-opacity 0.2s ease;

function generateCoinSvg(uid, label){
  const gid = 'grad_'+uid;
  const dispLabel = (label!==undefined && label!==null) ? label : 'C';
  const text = dispLabel
    ? `<text x="50" y="60" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="30" fill="#fff8d6" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))">${dispLabel}</text>`
    : '';
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fae078"/>
        <stop offset="50%" stop-color="#e29b2b"/>
        <stop offset="100%" stop-color="#995810"/>
      </linearGradient>
    </defs>
    <circle cx="50" cy="50" r="45" fill="url(#${gid})" stroke="#6b3a04" stroke-width="2"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.3" stroke-dasharray="3.5,2.5"/>
    <circle cx="50" cy="50" r="33" fill="rgba(0,0,0,0.12)" stroke="rgba(255,215,0,0.3)" stroke-width="1"/>
    ${text}
  </svg>`;
}

function renderCustomFacetShape(sides, uid, label){
  if(sides === 'coin') return generateCoinSvg(uid, label);
  if(sides === 2) return dieShapeSvg(2, uid, label);
  const s = Math.max(3, Math.min(100, parseInt(sides,10) || 7));
  const gid = 'grad_'+uid;

  if(s === 3){
    const pTop = [50, 7], pRight = [93, 89], pLeft = [7, 89];
    const c = [50, 61];
    const ipTop = [50, 34], ipRight = [71.5, 75], ipLeft = [28.5, 75];
    const outerPoints = `${pTop.join(',')} ${pRight.join(',')} ${pLeft.join(',')}`;
    const innerPoints = `${ipTop.join(',')} ${ipRight.join(',')} ${ipLeft.join(',')}`;
    const facetPolys = `
      <polygon points="${ipTop[0]},${ipTop[1]} ${pTop[0]},${pTop[1]} ${pRight[0]},${pRight[1]} ${ipRight[0]},${ipRight[1]}" fill="rgba(255,255,255,0.15)" stroke="rgba(0,0,0,0.28)" stroke-width="0.8"/>
      <polygon points="${c[0]},${c[1]} ${ipTop[0]},${ipTop[1]} ${ipRight[0]},${ipRight[1]}" fill="rgba(0,0,0,0.12)" stroke="rgba(0,0,0,0.22)" stroke-width="0.7"/>
      <polygon points="${ipRight[0]},${ipRight[1]} ${pRight[0]},${pRight[1]} ${pLeft[0]},${pLeft[1]} ${ipLeft[0]},${ipLeft[1]}" fill="rgba(0,0,0,0.2)" stroke="rgba(0,0,0,0.28)" stroke-width="0.8"/>
      <polygon points="${c[0]},${c[1]} ${ipRight[0]},${ipRight[1]} ${ipLeft[0]},${ipLeft[1]}" fill="rgba(255,255,255,0.08)" stroke="rgba(0,0,0,0.22)" stroke-width="0.7"/>
      <polygon points="${ipLeft[0]},${ipLeft[1]} ${pLeft[0]},${pLeft[1]} ${pTop[0]},${pTop[1]} ${ipTop[0]},${ipTop[1]}" fill="rgba(255,255,255,0.15)" stroke="rgba(0,0,0,0.28)" stroke-width="0.8"/>
      <polygon points="${c[0]},${c[1]} ${ipLeft[0]},${ipLeft[1]} ${pTop[0]},${pTop[1]}" fill="rgba(0,0,0,0.12)" stroke="rgba(0,0,0,0.22)" stroke-width="0.7"/>
    `;
    const text = (label!==undefined && label!==null)
      ? `<text x="50" y="67" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="28" fill="#ffffff" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.8))">${label}</text>`
      : '';
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8c52ff"/>
          <stop offset="100%" stop-color="#3d1475"/>
        </linearGradient>
      </defs>
      <polygon points="${outerPoints}" fill="url(#${gid})" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
      ${facetPolys}
      <polygon points="${innerPoints}" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
      ${text}
    </svg>`;
  }

  const cx = 50, cy = 50, r = 44;
  const pts = [];
  for(let i=0; i<s; i++){
    const ang = -Math.PI/2 + (2 * Math.PI * i / s);
    pts.push([+(cx + r * Math.cos(ang)).toFixed(1), +(cy + r * Math.sin(ang)).toFixed(1)]);
  }
  const outerPoints = pts.map(p=>p.join(',')).join(' ');

  const innerR = r * 0.48;
  const innerPts = [];
  for(let i=0; i<s; i++){
    const ang = -Math.PI/2 + (2 * Math.PI * i / s);
    innerPts.push([+(cx + innerR * Math.cos(ang)).toFixed(1), +(cy + innerR * Math.sin(ang)).toFixed(1)]);
  }
  const innerPoints = innerPts.map(p=>p.join(',')).join(' ');

  let facetPolys = '';
  for(let i=0; i<s; i++){
    const p1 = pts[i];
    const p2 = pts[(i+1)%s];
    const ip1 = innerPts[i];
    const ip2 = innerPts[(i+1)%s];
    const shadeA = (i % 2 === 0) ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.2)';
    const shadeB = ((i + 1) % 2 === 0) ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.12)';
    facetPolys += `<polygon points="${ip1[0]},${ip1[1]} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]} ${ip2[0]},${ip2[1]}" fill="${shadeA}" stroke="rgba(0,0,0,0.28)" stroke-width="0.8"/>`;
    facetPolys += `<polygon points="50,50 ${ip1[0]},${ip1[1]} ${ip2[0]},${ip2[1]}" fill="${shadeB}" stroke="rgba(0,0,0,0.22)" stroke-width="0.7"/>`;
  }

  const fontSize = s > 99 ? 20 : (s > 20 ? 24 : 28);
  const text = (label!==undefined && label!==null)
    ? `<text x="50" y="58" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="${fontSize}" fill="#ffffff" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.8))">${label}</text>`
    : '';

  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8c52ff"/>
        <stop offset="100%" stop-color="#3d1475"/>
      </linearGradient>
    </defs>
    <polygon points="${outerPoints}" fill="url(#${gid})" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
    ${facetPolys}
    <polygon points="${innerPoints}" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    ${text}
  </svg>`;
}

const CUST_THEMES = {
  2:  { color:'#4fa1d8', glow:'rgba(79,161,216,0.7)', bg:'rgba(79,161,216,0.12)', border:'rgba(79,161,216,0.45)' },
  4:  { color:'#58a86a', glow:'rgba(88,168,106,0.7)',  bg:'rgba(88,168,106,0.12)',  border:'rgba(88,168,106,0.45)' },
  6:  { color:'#43a3b3', glow:'rgba(67,163,179,0.7)',  bg:'rgba(67,163,179,0.12)',  border:'rgba(67,163,179,0.45)' },
  8:  { color:'#8a67c4', glow:'rgba(138,103,196,0.7)', bg:'rgba(138,103,196,0.12)', border:'rgba(138,103,196,0.45)' },
  10: { color:'#c45a90', glow:'rgba(196,90,144,0.7)', bg:'rgba(196,90,144,0.12)', border:'rgba(196,90,144,0.45)' },
  12: { color:'#cc5560', glow:'rgba(204,85,96,0.7)',  bg:'rgba(204,85,96,0.12)',  border:'rgba(204,85,96,0.45)' },
  20: { color:'#e09a45', glow:'rgba(224,154,69,0.7)', bg:'rgba(224,154,69,0.12)', border:'rgba(224,154,69,0.45)' },
  default: { color:'#b78aff', glow:'rgba(140,82,255,0.55)', bg:'rgba(140,82,255,0.09)', border:'rgba(140,82,255,0.35)' }
};

function getCustomPreviewSvg(n, uid){
  if(n === 'coin') return generateCoinSvg(uid, '🪙');
  if(n === 2) return dieShapeSvg(2, uid, 'd2');
  if(DICE_COLORS[n]) return dieShapeSvg(n, uid, n);
  return renderCustomFacetShape(n, uid, 'd' + n);
}

function dieShapeSvg(sides, uid, label){
  if(sides==='coin') return generateCoinSvg(uid, label);
  if(sides===2){
    const gid = 'grad_'+uid;
    const c = DICE_COLORS[2];
    const text = (label!==undefined && label!==null)
      ? `<text x="50" y="61" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="28" fill="#ffffff" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.85))">${label}</text>`
      : '';
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${c.light}"/>
          <stop offset="100%" stop-color="${c.dark}"/>
        </linearGradient>
      </defs>
      <path d="M 50,7 C 84,26 84,74 50,93 C 16,74 16,26 50,7 Z" fill="url(#${gid})" stroke="rgba(0,0,0,0.35)" stroke-width="1.8"/>
      <path d="M 50,7 C 22,26 22,74 50,93 Z" fill="rgba(255,255,255,0.18)" stroke="rgba(0,0,0,0.2)" stroke-width="0.8"/>
      <path d="M 50,7 C 78,26 78,74 50,93 Z" fill="rgba(0,0,0,0.18)" stroke="rgba(0,0,0,0.2)" stroke-width="0.8"/>
      <line x1="50" y1="7" x2="50" y2="93" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
      ${text}
    </svg>`;
  }
  if(!DICE_COLORS[sides]) return renderCustomFacetShape(sides, uid, label);
  const c = DICE_COLORS[sides];
  const gid = 'grad_'+uid;
  let shape='';
  if(sides===4) shape = `<polygon points="50,6 96,90 4,90" fill="url(#${gid})" stroke="rgba(0,0,0,.25)"/>`;
  else if(sides===6) shape = `<rect x="9" y="9" width="82" height="82" rx="14" fill="url(#${gid})" stroke="rgba(0,0,0,.25)"/>`;
  else if(sides===8) shape = `<polygon points="50,4 96,50 50,96 4,50" fill="url(#${gid})" stroke="rgba(0,0,0,.25)"/><line x1="50" y1="4" x2="50" y2="96" stroke="rgba(0,0,0,.14)"/>`;
  else if(sides===10) shape = `<polygon points="50,4 93,42 50,96 7,42" fill="url(#${gid})" stroke="rgba(0,0,0,.25)"/><polyline points="7,42 50,58 93,42" fill="none" stroke="rgba(0,0,0,.14)"/><line x1="50" y1="58" x2="50" y2="96" stroke="rgba(0,0,0,.14)"/>`;
  else if(sides===12) shape = `<polygon points="50,4 95,38 78,94 22,94 5,38" fill="url(#${gid})" stroke="rgba(0,0,0,.25)"/>`;
  else shape = `<polygon points="50,3 91,26 91,74 50,97 9,74 9,26" fill="url(#${gid})" stroke="rgba(0,0,0,.25)"/><polygon points="50,24 75,63 25,63" fill="rgba(255,255,255,.07)" stroke="rgba(0,0,0,.16)"/>`;
  const text = (label!==undefined && label!==null)
    ? `<text x="50" y="${DICE_LABEL_Y[sides]}" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="32" fill="#fff">${label}</text>`
    : '';
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${c.light}"/><stop offset="1" stop-color="${c.dark}"/></linearGradient></defs>${shape}${text}</svg>`;
}

function trayDieHtml(d){
  const isCoin = (d.sides === 'coin');
  const valText = isCoin ? (d.value === 2 ? 'W' : 'L') : d.value;
  return `<div class="die s${d.sides}" data-id="${d.id}" title="Убрать ${isCoin?'монету':'кость'}">
    ${dieShapeSvg(d.sides, d.id, isCoin ? '' : null)}
    <div class="val">${valText}</div>
  </div>`;
}

function currentDiceTotal(){
  if(!diceState.dice.length) return 0;
  const numDice = diceState.dice.filter(d => d.sides !== 'coin');
  const coinDice = diceState.dice.filter(d => d.sides === 'coin');

  if(!numDice.length && coinDice.length){
    return coinDice.map(c => c.value === 2 ? 'W' : 'L').join(', ');
  }

  const numSum = numDice.reduce((s,d)=>s+d.value,0) + diceState.modifier;
  if(coinDice.length){
    const coinStr = coinDice.map(c => c.value === 2 ? 'W' : 'L').join(', ');
    return `${numSum} · ${coinStr}`;
  }
  return numSum;
}

function diceNotation(compact){
  const groups={};
  diceState.dice.forEach(d=>{groups[d.sides]=(groups[d.sides]||0)+1;});
  const parts=[];
  Object.keys(groups).filter(s => s !== 'coin').map(Number).sort((a,b)=>b-a).forEach(s=>{
    parts.push(`${groups[s]}d${s}`);
  });
  if(groups['coin']){
    parts.push(`${groups['coin']}C`);
  }
  let n=parts.join(compact?'+':' + ');
  const m=diceState.modifier;
  if(m>0) n+=(compact?'+':' + ')+m;
  else if(m<0) n+=(compact? String(m) : ' − '+Math.abs(m));
  return n;
}

function animateDie(el, sides, finalValue, dur){
  const valEl = el.querySelector('.val');
  if(!valEl) return;
  if(el._diceIv) clearInterval(el._diceIv);
  el.classList.add('rolling');
  const isCoin = (sides === 'coin');
  const start = performance.now();
  el._diceIv = setInterval(()=>{
    if(isCoin){
      valEl.textContent = Math.random() < 0.5 ? 'W' : 'L';
    } else {
      valEl.textContent = 1+Math.floor(Math.random()*sides);
    }
    if(performance.now()-start>=dur){
      clearInterval(el._diceIv); el._diceIv=null;
      el.classList.remove('rolling');
      valEl.textContent = isCoin ? (finalValue === 2 ? 'W' : 'L') : finalValue;
    }
  },70);
}

function updateLabelPreview(){
  const el = document.getElementById('labelPreview');
  if(!el) return;
  if(!diceState.dice.length){
    const label = currentDiceLabel();
    const m = diceState.modifier;
    const modStr = m ? (m > 0 ? (' + ' + m) : (' − ' + Math.abs(m))) : '';
    el.textContent = `*[Результат броска ${label?label+' ':''}1d20: … ]*${modStr}`;
    return;
  }
  el.textContent = buildDiceResultLines().join('\n');
}

function updateDiceReadout(){
  const totalEl=document.getElementById('diceTotal');
  const notEl=document.getElementById('diceNotation');
  if(totalEl) totalEl.textContent = diceState.dice.length ? currentDiceTotal() : '—';
  if(notEl) notEl.textContent = diceState.dice.length ? diceNotation(false) : '';
  updateLabelPreview();
}

function updateDiceControls(){
  const has = diceState.dice.length>0;
  ['rollAllBtn','clearDiceBtn','copyResultBtn'].forEach(id=>{
    const b=document.getElementById(id);
    if(b) b.disabled = !has;
  });
}

function currentLabelEmojiFor(sides){
  if(!diceState.labelCat) return '';
  if(diceState.labelCat==='custom') return (diceState.customLabel||'').trim() ? '✎' : '';
  const cat = DICE_LABEL_CATEGORIES.find(c=>c.key===diceState.labelCat);
  if(!cat) return '';
  const item = cat.items.find(i=>i.ru===diceState.label);
  if(!item) return '';
  const applies = item.std===null || sides===item.std;
  return applies ? item.icon : '';
}

function currentLabelAppliedTo(sides){
  const label = currentDiceLabel();
  if(!label) return '';
  if(diceState.labelCat==='custom') return label;
  const std = currentLabelStd();
  return (std===null || sides===std) ? label : '';
}

function pushDiceHistory(entries){
  entries.forEach(e=>diceState.history.push(e));
  if(diceState.history.length > DICE_HISTORY_MAX){
    diceState.history = diceState.history.slice(-DICE_HISTORY_MAX);
  }
  updateDiceHistory();
}

function histDieHtml(h, isNew){
  const isCoin = (h.sides === 'coin');
  const valText = isCoin ? (h.value === 2 ? 'W' : 'L') : h.value;
  const tip = isCoin
    ? `${h.emoji?h.emoji+' ':''}${h.label ? h.label+' · ' : ''}Монета C = ${valText}`
    : `${h.emoji?h.emoji+' ':''}${h.label ? h.label+' · ' : ''}d${h.sides} = ${h.value}`;
  return `<div class="hist-die${isNew?' hist-new':''}" data-tip="${escapeAttr(tip)}">
    ${dieShapeSvg(h.sides, 'h'+h.uid, isCoin ? '' : null)}
    <div class="hv" style="${isCoin?'font-size:14px;font-family:Cinzel,serif;font-weight:700;color:#fff8d6;':''}">${valText}</div>
    ${h.emoji?`<div class="he">${h.emoji}</div>`:''}
  </div>`;
}

function updateDiceHistory(){
  const box = document.getElementById('diceHistory');
  if(!box) return;
  const n = diceState.history.length;
  box.innerHTML = diceState.history.map((h,i)=>histDieHtml(h, i===n-1)).join('');
  const clearBtn = document.getElementById('clearHistBtn');
  if(clearBtn) clearBtn.disabled = !n;
}

let histUid = 0;

function addDie(sides){
  const tray = document.querySelector('.dice-tray');
  if(!tray){ render(); return; } // подстраховка, если экран ещё не отрисован

  const id='die'+(++diceState.counter);
  const isCoin = (sides === 'coin');
  const value = isCoin ? (Math.random() < 0.5 ? 1 : 2) : (1+Math.floor(Math.random()*sides));
  diceState.dice.push({id,sides,value});

  const hint = tray.querySelector('.empty-hint');
  if(hint) hint.remove();

  const holder = document.createElement('div');
  holder.innerHTML = trayDieHtml({id,sides,value});
  const el = holder.firstElementChild;
  tray.appendChild(el);
  el.addEventListener('click', ()=>removeDie(id));

  updateDiceControls();
  const totalEl=document.getElementById('diceTotal');
  if(totalEl) totalEl.textContent='…';

  const dur=520+Math.random()*300;
  animateDie(el,sides,value,dur);
  setTimeout(()=>{
    updateDiceReadout();
    pushDiceHistory([{sides, value, uid:++histUid, emoji:currentLabelEmojiFor(sides), label:currentLabelAppliedTo(sides)}]);
  }, dur+90);
}

function removeDie(id){
  diceState.dice = diceState.dice.filter(d=>d.id!==id);
  const el=document.querySelector(`.die[data-id="${id}"]`);
  if(el){
    if(el._diceIv) clearInterval(el._diceIv);
    el.remove();
  }
  const tray = document.querySelector('.dice-tray');
  if(tray && !diceState.dice.length){
    tray.innerHTML = `<div class="empty-hint">Нажмите на кость внизу — она появится здесь и сразу будет брошена.<br>Клик по кости на поле убирает её.</div>`;
  }
  updateDiceControls();
  updateDiceReadout();
}

function rollAllDice(){
  if(!diceState.dice.length) return;
  let maxDur=0;
  const totalEl=document.getElementById('diceTotal');
  if(totalEl) totalEl.textContent='…';
  diceState.dice.forEach(d=>{
    const isCoin = (d.sides === 'coin');
    d.value = isCoin ? (Math.random() < 0.5 ? 1 : 2) : (1+Math.floor(Math.random()*d.sides));
    const el=document.querySelector(`.die[data-id="${d.id}"]`);
    if(!el) return;
    const dur=520+Math.random()*300;
    maxDur=Math.max(maxDur,dur);
    animateDie(el,d.sides,d.value,dur);
  });
  setTimeout(()=>{
    updateDiceReadout();
    pushDiceHistory(diceState.dice.map(d=>({
      sides:d.sides, value:d.value, uid:++histUid,
      emoji:currentLabelEmojiFor(d.sides), label:currentLabelAppliedTo(d.sides)
    })));
  }, maxDur+90);
}

function currentDiceLabel(){
  if(diceState.labelCat==='custom') return (diceState.customLabel||'').trim();
  if(!diceState.labelCat) return '';
  return diceState.label || '';
}

function buildDiceResultLines(){
  if(!diceState.dice.length) return [];

  const label = currentDiceLabel();
  const isCustom = diceState.labelCat==='custom';
  const std = currentLabelStd();

  const groups = {};
  diceState.dice.forEach(d=>{
    if(!groups[d.sides]) groups[d.sides] = [];
    groups[d.sides].push(d.value);
  });

  const lines = [];

  const sidesDesc = Object.keys(groups).filter(s => s !== 'coin').map(Number).sort((a,b)=>b-a);
  const appliesTo = (sides)=> !!label && (isCustom || std===null || sides===std);

  sidesDesc.forEach(sides=>{
    const vals = groups[sides];
    const prefix = appliesTo(sides) ? (label+' ') : '';
    const dieName = `${vals.length}d${sides}`;
    lines.push(`*[Результат броска ${prefix}${dieName}: ${vals.join(' | ')} ]*`);
  });

  if(groups['coin']){
    const coinVals = groups['coin'].map(v => v === 2 ? 'W' : 'L');
    const prefix = appliesTo('coin') ? (label+' ') : '';
    const coinName = `${groups['coin'].length}C`;
    lines.push(`*[Результат броска ${prefix}${coinName}: ${coinVals.join(' | ')} ]*`);
  }

  if(diceState.modifier && lines.length && sidesDesc.length){
    const m = diceState.modifier;
    const modStr = m > 0 ? (' + ' + m) : (' − ' + Math.abs(m));
    const targetIdx = (std !== null && sidesDesc.includes(std)) ? sidesDesc.indexOf(std) : (lines.length - (groups['coin'] ? 2 : 1));
    if(lines[targetIdx]) lines[targetIdx] += modStr;
  }

  return lines;
}

function copyDiceResult(){
  if(!diceState.dice.length) return;

  copyText(buildDiceResultLines().join('\n'));

  const btn=document.getElementById('copyResultBtn');
  if(btn){
    const old=btn.textContent;
    btn.textContent='Скопировано ✓';

let genRollCounter = 0;

function rollSpecValue(count, sides, mode){
  const rolls=[];
  for(let i=0;i<count;i++) rolls.push(1+Math.floor(Math.random()*sides));
  let value;
  if(mode==='max') value=Math.max(...rolls);
  else if(mode==='min') value=Math.min(...rolls);
  else value=rolls.reduce((a,b)=>a+b,0);
  return value;
}

function handleGenerateClick(btn){
  const template = btn.getAttribute('data-template');
  const count = parseInt(btn.getAttribute('data-count'),10);
  const sides = parseInt(btn.getAttribute('data-sides'),10);
  const mode = btn.getAttribute('data-mode');
  const value = rollSpecValue(count, sides, mode);
  const finalText = template.replace(': ]*', ': '+value+' ]*');
  copyText(finalText);

  const card = btn.closest('.card');
  if(!card) return;
  const overlay = card.querySelector('.gen-stamp');
  const holder = overlay ? overlay.querySelector('.gen-die') : null;
  if(!overlay || !holder) return;

  const uid = 'gen'+(++genRollCounter);
  holder.innerHTML = dieShapeSvg(sides, uid) + `<div class="val"></div>`;
  const valEl = holder.querySelector('.val');

  overlay.classList.add('active');
  holder.classList.add('rolling');
  const dur = 480;
  const start = performance.now();
  const iv = setInterval(()=>{
    valEl.textContent = 1+Math.floor(Math.random()*sides);
    if(performance.now()-start>=dur){
      clearInterval(iv);
      holder.classList.remove('rolling');
      valEl.textContent = value;
    }
  },70);

  clearTimeout(overlay._genT);
  overlay._genT = setTimeout(()=>{ overlay.classList.remove('active'); }, dur+950);
}

  const parts = path.split('.');

  for(let i=0;i<parts.length-1;i++) cur = cur[parts[i]];
  cur[parts[parts.length-1]] = value;
}

  return path.split('.').reduce((o,k)=>(o==null?o:o[k]), obj);
}

function hashColor(str){
  let h=0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) & 0xffffffff; }
  const hue = Math.abs(h) % 360;
  return `hsl(${hue},62%,48%)`;
}

function renderCharacters(){

function initDraftForView(){
  if(view.charId && view.charId!=='new'){
    const existing = CHARACTERS.find(c=>c.id===view.charId);
    charDraft = existing ? JSON.parse(JSON.stringify(existing)) : newCharacter();
  } else {
    charDraft = newCharacter();
  }
}

function abilityBoxHtml(key){
  const d=charDraft;
  return `
    <div class="ability-box">
      <label>${ABILITY_RU[key]}</label>
      <input type="number" min="1" max="30" data-field="abilities.${key}" value="${d.abilities[key]}">

    </div>`;
}
function saveRowHtml(key){
  const d=charDraft;
  const prof = d.saveProf[key];
  const mod = abilityMod(d.abilities[key]) + (prof?profBonus(d.level):0);
  return `
    <div class="save-row">
      <input type="checkbox" data-field="saveProf.${key}" ${prof?'checked':''}>

function skillRowHtml(def){
  const d=charDraft;
  const state = d.skillProf[def.key]||0;

  const abAbbr = ABILITY_ABBR[ABILITY_RU[def.ability]]||'';
  return `

function recomputeDerived(){
  const d = charDraft;
  const pb = profBonus(d.level);
  ABILITY_KEYS.forEach(k=>{
    const el = document.getElementById('am-'+k);
    if(el) el.textContent = fmtMod(abilityMod(d.abilities[k]));
    const sEl = document.getElementById('saveBonus-'+k);
    if(sEl) sEl.textContent = fmtMod(abilityMod(d.abilities[k]) + (d.saveProf[k]?pb:0));
  });
  SKILL_DEFS.forEach(def=>{
    const el = document.getElementById('skillBonus-'+def.key);
    if(el){
      const state = d.skillProf[def.key]||0;
      el.textContent = fmtMod(abilityMod(d.abilities[def.ability]) + state*pb);
    }
  });
  const pbVal = document.getElementById('pbVal');
  if(pbVal) pbVal.textContent = fmtMod(pb);
  const pp = document.getElementById('passivePerception');
  if(pp) pp.textContent = 10 + abilityMod(d.abilities.wis) + (d.skillProf.perception||0)*pb;
  const initEl = document.getElementById('initTotal');
  if(initEl) initEl.textContent = fmtMod(abilityMod(d.abilities.dex) + Number(d.initMisc||0));
  const dcEl = document.getElementById('spellDC');
  if(dcEl) dcEl.textContent = 8 + pb + abilityMod(d.abilities[d.spellAbility]);
  const atkEl = document.getElementById('spellAtk');
  if(atkEl) atkEl.textContent = fmtMod(pb + abilityMod(d.abilities[d.spellAbility]));
}

function addAttackRow(){
  charDraft.attacks.push({name:'',bonus:'',damage:'',type:''});
  const list = document.getElementById('attacksList');
  if(list){
    const idx = charDraft.attacks.length-1;
    list.insertAdjacentHTML('beforeend', attackRowHtml(charDraft.attacks[idx], idx));
  }
}
function removeAttackRow(idx){
  charDraft.attacks.splice(idx,1);
  const list = document.getElementById('attacksList');
  if(list) list.innerHTML = charDraft.attacks.map((a,i)=>attackRowHtml(a,i)).join('');
}

function upsertCharacter(){
  const d = charDraft;
  if(!d.id) d.id = genId();
  const i = CHARACTERS.findIndex(c=>c.id===d.id);
  const copy = JSON.parse(JSON.stringify(d));
  if(i>=0) CHARACTERS[i]=copy; else CHARACTERS.push(copy);
  saveCharactersToStorage();
  view.charId = d.id;
}

function deleteCharacter(id){
  CHARACTERS = CHARACTERS.filter(c=>c.id!==id);
  saveCharactersToStorage();
}

function exportCharacterJson(){
  const d = charDraft;
  const blob = new Blob([JSON.stringify(d, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (d.name||'персонаж').toLowerCase().replace(/[^a-zа-я0-9]+/gi,'_').replace(/^_+|_+$/g,'') || 'персонаж';
  a.href = url; a.download = safeName+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function importCharacterFromFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      const base = newCharacter();
      const merged = Object.assign(base, data, {id:null});
      merged.id = genId();
      CHARACTERS.push(merged);
      saveCharactersToStorage();
      render();
    }catch(e){
      alert('Не удалось прочитать файл — это не корректный JSON карточки персонажа.');
    }
  };
  reader.readAsText(file);
}

function copyCharacterAsText(){
  const d = charDraft;
  const pb = profBonus(d.level);
  const abLine = ABILITY_KEYS.map(k=>`${ABILITY_RU[k]} ${d.abilities[k]} (${fmtMod(abilityMod(d.abilities[k]))})`).join(', ');
  const skillsProf = SKILL_DEFS.filter(s=>(d.skillProf[s.key]||0)>0)
    .map(s=>`${s.ru} ${fmtMod(abilityMod(d.abilities[s.ability])+(d.skillProf[s.key])*pb)}${d.skillProf[s.key]===2?' (эксперт.)':''}`)
    .join(', ') || '—';
  const attacksText = d.attacks.filter(a=>a.name).map(a=>`  ${a.name}: ${a.bonus||'—'} попадание, ${a.damage||'—'} ${a.type||''}`).join('\n') || '  —';
  const lines = [
    `${d.name||'Без имени'} — ${d.className||'?'}${d.subclass?(' ('+d.subclass+')'):''}, уровень ${d.level}`,
    `${d.species||''} ${d.background?('· '+d.background):''} ${d.alignment?('· '+d.alignment):''}`.trim(),
    `Бонус мастерства: ${fmtMod(pb)}`,
    `Характеристики: ${abLine}`,
    `КД ${d.ac} · Инициатива ${fmtMod(abilityMod(d.abilities.dex)+Number(d.initMisc||0))} · Скорость ${d.speed} фт.`,
    `Хиты: ${d.hpCurrent}/${d.hpMax}${d.hpTemp?(' (+'+d.hpTemp+' врем.)'):''} · Кости хитов: ${d.hitDiceTotal}${d.hitDiceType}`,
    `Владение навыками: ${skillsProf}`,
    `Атаки:\n${attacksText}`
  ];
  if(d.spellEnabled){
    lines.push(`Заклинания (${ABILITY_RU[d.spellAbility]}): СЛ ${8+pb+abilityMod(d.abilities[d.spellAbility])}, атака ${fmtMod(pb+abilityMod(d.abilities[d.spellAbility]))}`);
    if(d.spellNotes) lines.push(d.spellNotes);
  }
  if(d.equipment) lines.push(`Инвентарь: ${d.equipment}`);
  if(d.features) lines.push(`Умения и черты: ${d.features}`);
  if(d.backstory) lines.push(`История: ${d.backstory}`);
  copyText(lines.join('\n'));
}

function abilityViewBoxHtml(key, d){
  return `

      <div class="mod">${fmtMod(abilityMod(d.abilities[key]))}</div>

}
function saveViewRowHtml(key, d, pb){

function skillViewRowHtml(def, d, pb){

function attackViewRowHtml(a){
  return `
    <div class="attack-view-row">
      <span>${escapeHtml(a.name)}</span>
      <span class="av-bonus">${escapeHtml(a.bonus||'—')}</span>
      <span>${escapeHtml(a.damage||'—')}${a.type?(' '+escapeHtml(a.type)):''}</span>
    </div>`;
}
function viewTextBlock(label, value){
  if(!value) return '';
  return `
    <div class="view-text-block">
      ${label ? `<div class="vtb-label">${label}</div>` : ''}
      <div class="vtb-body">${escapeHtml(value)}</div>
    </div>`;
}

function renderCharacterView(){
  const d = CHARACTERS.find(c=>c.id===view.charId);
  if(!d){
    view = {screen:'characters'};
    return renderCharacters();
  }
  charDraft = JSON.parse(JSON.stringify(d)); // чтобы экспорт/копирование текста работали с этого экрана тоже

  const pb = profBonus(d.level);
  const passivePerception = 10 + abilityMod(d.abilities.wis) + (d.skillProf.perception||0)*pb;
  const initTotal = abilityMod(d.abilities.dex) + Number(d.initMisc||0);

  const abilityBoxes = ABILITY_KEYS.map(k=>abilityViewBoxHtml(k,d)).join('');
  const saveRows = ABILITY_KEYS.map(k=>saveViewRowHtml(k,d,pb)).join('');
  const skillRows = SKILL_DEFS.map(def=>skillViewRowHtml(def,d,pb)).join('');
  const attackRows = d.attacks.filter(a=>a.name).map(attackViewRowHtml).join('') || '<div class="char-empty" style="padding:10px 0;">Нет записанных атак</div>';

  const headerLine1 = [d.className||'Без класса', d.subclass, d.level?('уровень '+d.level):null].filter(Boolean).join(' · ');
  const headerLine2 = [d.species, d.background, d.alignment].filter(Boolean).join(' · ');

  const currencyBits = [['pp','ПМ'],['gp','ЗМ'],['ep','ЭМ'],['sp','СМ'],['cp','ММ']]
    .filter(([k])=>Number(d[k])>0).map(([k,label])=>`<span><b>${d[k]}</b> ${label}</span>`).join('');

  const spellBlock = d.spellEnabled ? `
    <div class="sheet-section">
      <div class="section-label">Заклинания</div>
      <div class="combat-strip">
        <div class="combat-box"><span class="cb-label">Характеристика</span><div class="readonly-val">${ABILITY_RU[d.spellAbility]}</div></div>
        <div class="combat-box"><span class="cb-label">Сложность спасброска</span><div class="readonly-val">${8+pb+abilityMod(d.abilities[d.spellAbility])}</div></div>
        <div class="combat-box"><span class="cb-label">Атака заклинанием</span><div class="readonly-val">${fmtMod(pb+abilityMod(d.abilities[d.spellAbility]))}</div></div>
      </div>
      <div class="slot-grid">${Array.from({length:9},(_,i)=>i+1).map(lvl=>`
        <div class="slot-box"><span class="sb-label">Ур. ${lvl}</span><div>${d.slotsUsed[lvl]||0} / ${d.slots[lvl]||0}</div></div>
      `).join('')}</div>
      ${viewTextBlock('Известные / подготовленные заклинания', d.spellNotes)}
    </div>` : '';

  return `
    ${renderCrumb([{label:'Компендиум', nav:'home'},{label:'Персонажи', nav:'characters'},{label: d.name || 'Без имени'}])}
    <button class="back" data-go="characters">← Назад</button>

    <div class="char-view-header">
      <div class="cv-name">${escapeHtml(d.name||'Без имени')}</div>
      <div class="cv-line">${escapeHtml(headerLine1)}</div>
      ${headerLine2?`<div class="cv-line">${escapeHtml(headerLine2)}</div>`:''}
    </div>

    <div class="sheet-actions">
      <button class="btn-primary" id="editCharBtn" data-go="sheet:${d.id}">✏️ Редактировать</button>
      <button class="btn-ghost" id="exportCharBtn">⬇️ Экспорт JSON</button>
      <button class="btn-ghost" id="copyCharBtn">📋 Скопировать как текст</button>
      <button class="btn-ghost" id="deleteCharBtn" style="color:var(--crimson-bright);border-color:var(--crimson-bright);">🗑 Удалить</button>
    </div>

    <div class="sheet-section">
      <div class="section-label">Характеристики</div>
      <div class="ability-row">${abilityBoxes}</div>
    </div>

    <div class="sheet-section">
      <div class="section-label">Боевые параметры</div>
      <div class="combat-strip">
        <div class="combat-box"><span class="cb-label">КД</span><div class="readonly-val">${d.ac}</div></div>
        <div class="combat-box"><span class="cb-label">Инициатива</span><div class="readonly-val">${fmtMod(initTotal)}</div></div>
        <div class="combat-box"><span class="cb-label">Скорость</span><div class="readonly-val">${d.speed}</div></div>
        <div class="combat-box"><span class="cb-label">Хиты</span><div class="readonly-val">${d.hpCurrent}/${d.hpMax}${d.hpTemp?(' +'+d.hpTemp):''}</div></div>
        <div class="combat-box"><span class="cb-label">Кости хитов</span><div class="readonly-val" style="font-size:15px;">${escapeHtml(String(d.hitDiceTotal))}${escapeHtml(d.hitDiceType)}</div></div>

        <div class="combat-box"><span class="cb-label">Пасс. восприятие</span><div class="readonly-val">${passivePerception}</div></div>

    <div class="sheet-section">

      ${skillRows}
    </div>

    <div class="sheet-section">
      <div class="section-label">Атаки</div>
      ${attackRows}
    </div>

    <div class="sheet-section">
      <div class="section-label">Снаряжение</div>
      ${currencyBits ? `<div class="currency-view-strip">${currencyBits}</div>` : ''}
      ${viewTextBlock('Инвентарь', d.equipment)}
    </div>

    ${d.features ? `<div class="sheet-section"><div class="section-label">Умения и черты</div>${viewTextBlock('', d.features)}</div>` : ''}

    <div class="sheet-section">

      <div class="sheet-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));">
        ${viewTextBlock('Доспехи', d.profArmor)}
        ${viewTextBlock('Оружие', d.profWeapons)}
        ${viewTextBlock('Инструменты', d.profTools)}
        ${viewTextBlock('Языки', d.languages)}
      </div>
    </div>

    <div class="sheet-section">
      <div class="section-label">Личность</div>
      <div class="sheet-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));">
        ${viewTextBlock('Черты характера', d.traits)}
        ${viewTextBlock('Идеалы', d.ideals)}
        ${viewTextBlock('Привязанности', d.bonds)}
        ${viewTextBlock('Слабости', d.flaws)}
      </div>
    </div>

    <div class="sheet-section">
      <div class="section-label">Внешность и история</div>
      <div class="sheet-grid" style="margin-bottom:12px;">
        ${viewTextBlock('Возраст', d.age)}
        ${viewTextBlock('Рост', d.height)}
        ${viewTextBlock('Вес', d.weight)}
        ${viewTextBlock('Глаза', d.eyes)}
        ${viewTextBlock('Кожа', d.skin)}
        ${viewTextBlock('Волосы', d.hair)}
      </div>
      ${viewTextBlock('История персонажа', d.backstory)}
    </div>

    ${spellBlock}
  `;
}

function flaskSvg(uid, color){
  const clipId = 'flaskClip_'+uid;
  const shape = 'M38,8 L38,42 L18,118 Q18,132 33,132 L67,132 Q82,132 82,118 L62,42 L62,8 Z';
  return `<svg class="flask" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="${clipId}"><path d="${shape}"/></clipPath></defs>
    <g clip-path="url(#${clipId})">
      <rect class="flask-liquid" x="10" y="135" width="80" height="0" fill="${color}"></rect>
    </g>
    <path d="${shape}" fill="none" stroke="var(--ink-dim)" stroke-width="3"/>
    <line x1="30" y1="8" x2="70" y2="8" stroke="var(--ink-dim)" stroke-width="4" stroke-linecap="round"/>
  </svg>`;
}

function recipeCardHtml(r){
  const kitLabel = r.kit==='herbalism' ? 'Набор травника' : 'Алхимический набор';
  const ingRows = (r.ingredients||[]).filter(i=>i.name).map(ing=>{
    const stock = findIngredient(ing.name);
    const have = stock ? stock.qty : 0;
    const cls = have>=ing.qty ? 'have' : 'short';
    return `<div class="rc-ing-row"><span>${escapeHtml(ing.name)}</span><span class="${cls}">${have}/${ing.qty}</span></div>`;
  }).join('') || '<div class="rc-ing-row"><span>Без ингредиентов</span></div>';
  const uid = 'flask'+Math.random().toString(36).slice(2,8);
  return `
    <div class="recipe-card" data-recipe-id="${r.id}">
      <div class="rc-top">
        <div>
          <div class="rc-name">${escapeHtml(r.name||'Без названия')}</div>
          <div class="rc-meta">${r.cost||0} зм · ${escapeHtml(r.time||'—')}${r.dc?(' · СЛ '+escapeHtml(String(r.dc))):''}</div>
        </div>
        <span class="kit-badge">${kitLabel}</span>
      </div>
      <div class="rc-ingredients">${ingRows}</div>
      ${r.effect?`<div class="rc-effect">${escapeHtml(r.effect)}</div>`:''}
      <div class="rc-actions">
        <button type="button" class="rc-btn brew" data-brew="${r.id}">⚗️ Сварить</button>
        <button type="button" class="rc-btn" data-go="recipeForm:${r.id}">Изменить</button>
        <button type="button" class="rc-btn" data-delete-recipe="${r.id}" style="color:var(--crimson-bright);">Удалить</button>
      </div>
      <div class="rc-missing-note" style="display:none;"></div>
      <div class="brew-overlay">
        ${flaskSvg(uid, hashColor(r.name||uid))}
        <div class="brew-label"></div>
      </div>
    </div>`;
}

function attemptBrew(recipeId){
  const recipe = RECIPES.find(r=>r.id===recipeId);
  if(!recipe) return;
  const missing = [];
  (recipe.ingredients||[]).forEach(ing=>{
    if(!ing.name) return;
    const stock = findIngredient(ing.name);
    const have = stock ? stock.qty : 0;
    if(have < ing.qty) missing.push(`${ing.name} (нужно ${ing.qty}, есть ${have})`);
  });
  const card = document.querySelector(`.recipe-card[data-recipe-id="${recipeId}"]`);
  if(missing.length){
    const note = card ? card.querySelector('.rc-missing-note') : null;
    if(note){ note.textContent = 'Не хватает: '+missing.join(', '); note.style.display='block'; }
    return;
  }
  const note = card ? card.querySelector('.rc-missing-note') : null;
  if(note) note.style.display='none';

  (recipe.ingredients||[]).forEach(ing=>{
    if(!ing.name) return;
    const stock = findIngredient(ing.name);
    if(stock) stock.qty -= ing.qty;
  });
  INGREDIENTS = INGREDIENTS.filter(i=>i.qty>0);
  saveIngredientsToStorage();
  copyText(`*[Сварено: ${recipe.name}]*`);

  if(card){
    const overlay = card.querySelector('.brew-overlay');
    const label = card.querySelector('.brew-label');
    const liquid = card.querySelector('.flask-liquid');
    if(label) label.textContent = 'Сварено: '+recipe.name;
    if(overlay) overlay.classList.add('active');
    if(liquid){
      liquid.setAttribute('y','135'); liquid.setAttribute('height','0');
      const raf = typeof requestAnimationFrame==='function' ? requestAnimationFrame : (fn)=>setTimeout(fn,16);
      raf(()=>{ raf(()=>{
        liquid.setAttribute('y','48'); liquid.setAttribute('height','87');
      });});
    }
    setTimeout(()=>{ if(overlay) overlay.classList.remove('active'); render(); }, 1900);
  } else {
    render();
  }
}

    return `

}

  const sub = cls ? cls.subclasses[subKey] : null;

    view = {screen:'class', cls:clsKey};

  return `
